<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Expense Tracker</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Student Expense Tracker</h1>
        <p>Track your daily expenses easily</p>

        <div class="card">

            <h2>Set Budget</h2>

            <input
                type="number"
                id="budget"
                placeholder="Enter total budget"
            >

            <button onclick="setBudget()">
                Set Budget
            </button>

        </div>

        <div class="card">

            <h2>Add Expense</h2>

            <input
                type="text"
                id="expenseName"
                placeholder="Expense name"
            >

            <input
                type="number"
                id="expenseAmount"
                placeholder="Expense amount"
            >

            <select id="category">

                <option value="Food">Food</option>
                <option value="Travel">Travel</option>
                <option value="Shopping">Shopping</option>
                <option value="Education">Education</option>
                <option value="Other">Other</option>

            </select>

            <button onclick="addExpense()">
                Add Expense
            </button>

        </div>

        <div class="summary">

            <div>
                <h3>Budget</h3>
                <p>₹<span id="budgetDisplay">0</span></p>
            </div>

            <div>
                <h3>Total Expense</h3>
                <p>₹<span id="totalExpense">0</span></p>
            </div>

            <div>
                <h3>Remaining</h3>
                <p>₹<span id="remaining">0</span></p>
            </div>

        </div>

        <div class="card">

            <h2>Expense History</h2>

            <ul id="expenseList"></ul>

        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
